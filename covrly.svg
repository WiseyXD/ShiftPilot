<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100" fill="none" role="img" aria-label="Covrly">
  <!-- steam -->
  <g stroke="#3B2A20" stroke-width="2.4" stroke-linecap="round" opacity="0.28" fill="none">
    <path d="M43 26 q-4 -5 0 -10 q4 -5 0 -10" />
    <path d="M57 26 q4 -5 0 -10 q-4 -5 0 -10" />
  </g>

  <!-- saucer -->
  <ellipse cx="50" cy="90" rx="30" ry="5.5" fill="#3B2A20" opacity="0.12" />

  <!-- handle -->
  <path
    d="M72 50 q15 1 15 15 q0 13 -15 13"
    stroke="#3B2A20"
    stroke-width="5.5"
    fill="none"
    stroke-linecap="round"
  />

  <!-- cup body -->
  <path
    d="M27 37 L73 37 L68 80 Q67 88 58 88 L42 88 Q33 88 32 80 Z"
    fill="#F4EAD8"
    stroke="#3B2A20"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- terracotta sleeve -->
  <path d="M30.5 58 L69.5 58 L67.8 70 L32.2 70 Z" fill="#C9724A" opacity="0.92" />
  <path
    d="M30.5 58 L69.5 58 M32.2 70 L67.8 70"
    stroke="#3B2A20"
    stroke-width="1.4"
    opacity="0.25"
  />

  <!-- coffee surface -->
  <ellipse cx="50" cy="37" rx="23" ry="6" fill="#F4EAD8" stroke="#3B2A20" stroke-width="3" />
  <ellipse cx="50" cy="37" rx="17" ry="4" fill="#4A2E20" />

  <!-- face -->
  <g>
    <circle cx="43" cy="50" r="3.4" fill="#3B2A20" />
    <circle cx="57" cy="50" r="3.4" fill="#3B2A20" />
    <circle cx="44.1" cy="48.9" r="1" fill="#fff" />
    <circle cx="58.1" cy="48.9" r="1" fill="#fff" />
    <circle cx="39" cy="54" r="2.6" fill="#C9724A" opacity="0.45" />
    <circle cx="61" cy="54" r="2.6" fill="#C9724A" opacity="0.45" />
    <path
      d="M45 54 Q50 58.5 55 54"
      stroke="#3B2A20"
      stroke-width="2.4"
      fill="none"
      stroke-linecap="round"
    />
  </g>
</svg>
